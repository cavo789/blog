# Pre-commit hooks for the Docusaurus blog.
# Install hooks:  pre-commit install --config .config/.pre-commit-config.yaml
# Run all files:  pre-commit run --all-files --config .config/.pre-commit-config.yaml
# Update versions: pre-commit autoupdate --config .config/.pre-commit-config.yaml

# Certificate key file is read-only (chmod 400) — exclude it from all file-content hooks.
exclude: '^\.devcontainer/mkcert-ca/'

repos:
  # ── Standard hygiene checks ──────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md, --markdown-linebreak-ext=mdx]
        exclude: '\.(jpg|jpeg|png|webp|gif|svg|ico|bmp|woff2?|ttf|eot|pdf)$'
      - id: end-of-file-fixer
        exclude: '\.(jpg|jpeg|png|webp|gif|svg|ico|bmp|woff2?|ttf|eot|pdf)$'
      - id: check-yaml
        # Blog code examples in files/ subdirectories are intentional YAML fragments
        exclude: '^(blog|\.unpublished)/.+/files/'
      - id: check-json
        # .vscode/ uses JSONC (comments allowed); blog files/ contains JSON snippets
        exclude: '^(tsconfig\.json|\.vscode/|blog/.+/files/|\.unpublished/.+/files/)'
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: '\.(jpg|jpeg|png|webp|gif|svg|ico|bmp|woff2?|ttf|eot|pdf)$'

  # ── Rust-based spell checker — blog posts only (fast) ────────────────────
  - repo: https://github.com/crate-ci/typos
    rev: v1.30.2
    hooks:
      - id: typos
        args: [--config, .config/typos.toml]
        # Check blog posts and pages; skip component/plugin/script internal docs
        files: '\.(md|mdx)$'
        exclude: '^(api|src/components/|plugins/|\.scripts/|\.claude/|\.github/|\.todos/|\.unpublished/)'

  # ── Markdown linter (uses existing .config/.markdownlint.json) ───────────
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.17.2
    hooks:
      - id: markdownlint-cli2
        args: [--config, .config/.markdownlint-cli2.jsonc]
        types: [markdown]
        # Run once with all files instead of being split into one process per
        # CPU core (pre-commit's default) — avoids the banner/summary being
        # repeated once per batch, which is what made the output so verbose.
        require_serial: true
        # Internal files: memory, readmes, script docs, GitHub config, root README
        exclude: '^(\.claude/|\.github/|\.todos/|\.unpublished/|api|src/components/.+/readme\.md|plugins/.+/readme\.md|\.scripts/|README\.md$|\.unpublished/.+/files/)'

  # ── JS/JSX linting and formatting ────────────────────────────────────────
  - repo: local
    hooks:
      - id: eslint
        name: ESLint (JS/JSX/MJS)
        entry: yarn lint:js
        language: system
        pass_filenames: false
        files: '\.(js|jsx|mjs|cjs)$'

      - id: prettier
        name: Prettier (format check)
        entry: yarn format:check
        language: system
        pass_filenames: false
        files: '\.(js|jsx|mjs|cjs|css|json)$'

  # ── ELI5 annotation freshness (report-only for now, see TODO 045/036) ────
  - repo: local
    hooks:
      - id: eli5-freshness
        name: eli5 annotation freshness
        entry: node scripts/check-eli5-freshness.mjs --quiet
        language: system
        pass_filenames: false
        always_run: true
        verbose: true

  # ── "Ask my blog" question index freshness (report-only, see TODO 0083) ──
  - repo: local
    hooks:
      - id: questions-freshness
        name: ask-my-blog question freshness
        entry: node scripts/check-questions-freshness.mjs --quiet
        language: system
        pass_filenames: false
        always_run: true
        verbose: true
