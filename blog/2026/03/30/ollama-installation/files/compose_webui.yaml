name: tools

services:
  ollama:
    image: ollama/ollama
    container_name: %%name=ollama%%
    ports:
      - "%%port=11434%%:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: always
    # Uncomment the following lines if you have an NVIDIA GPU and want to use it
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: %%webui_name=open-webui%%
    ports:
      - "%%port_webui=4000%%:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - OLLAMA_BASE_URL=http://%%name=ollama%%:%%port=11434%%
    volumes:
      - open-webui_data:/app/backend/data
    restart: always
    depends_on:
      - ollama

volumes:
  ollama_data:
  open-webui_data:
