services:
  lazydocker:
    build: .
    image: lazydocker
    container_name: lazydocker
    stdin_open: true
    tty: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - lazydocker-config:/root/.config/jesseduffield/lazydocker
      - .:/workdir
    working_dir: /workdir

volumes:
  lazydocker-config:
    # Pin the real volume name so the standalone `docker run` in the wrapper
    # script below reuses this exact volume instead of creating its own
    # project-prefixed one.
    name: lazydocker-config
