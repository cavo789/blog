name: tools

services:
  anythingllm:
    image: mintplexlabs/anythingllm
    container_name: anythingllm
    cap_add:
      - SYS_ADMIN
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      - STORAGE_DIR=/app/server/storage
      - LLM_PROVIDER=ollama
      - OLLAMA_BASE_PATH=http://192.168.0.218:11434
      - OLLAMA_MODEL_PREF=qwen2.5:14b-instruct
      - OLLAMA_MODEL_TOKEN_LIMIT=8192
      - EMBEDDING_ENGINE=ollama
      - EMBEDDING_BASE_PATH=http://192.168.0.218:11434
      - EMBEDDING_MODEL_PREF=mxbai-embed-large
      # mxbai-embed-large has a 512-token context — a larger chunk size makes
      # every single embedding call fail. Keep this comfortably under it.
      - EMBEDDING_MODEL_MAX_CHUNK_LENGTH=400
      - OLLAMA_EMBEDDING_BATCH_SIZE=16
      - VECTOR_DB=lancedb
    volumes:
      - anythingllm_storage:/app/server/storage
    restart: always

volumes:
  anythingllm_storage:
