name: Code quality (ESLint + stylelint)

on:
  push:
  pull_request:

# Separate from deploy.yml on purpose: a lint failure must never block publishing
# the live site, but it must be visible on every push/PR.
jobs:
  lint:
    name: Lint JS/JSX and CSS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run lint (ESLint + stylelint)
        run: yarn lint
