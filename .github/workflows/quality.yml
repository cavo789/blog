name: Code quality (ESLint + stylelint)

# Separate from deploy.yml on purpose: a lint failure must never block publishing
# the live site, but it must be visible on every push/PR.
on:
  # `push` is limited to main while `pull_request` covers the branches. Without
  # that split, a push to a branch that has an open PR triggered this workflow
  # twice for the same commit.
  #
  # `yarn install` here restores a 2.6 GB node_modules, so both events skip
  # commits that cannot affect lint or the article link check. The list has to be
  # repeated per event — GitHub only accepts path filters inside an event, and
  # workflow files do not support YAML anchors. Note that .unpublished/ is
  # deliberately absent: the internal-links job checks drafts too.
  push:
    branches:
      - main
    paths-ignore:
      - ".claude/**"
      - ".config/**"
      - ".devcontainer/**"
      - ".scripts/**"
      - ".todos/**"
      - ".tools/**"
      - ".vscode/**"
      - "*.md"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - ".claude/**"
      - ".config/**"
      - ".devcontainer/**"
      - ".scripts/**"
      - ".todos/**"
      - ".tools/**"
      - ".vscode/**"
      - "*.md"
      - "LICENSE"

# Only the newest commit of a branch is worth linting; superseded runs are
# cancelled instead of queueing behind each other (the opposite choice from
# deploy.yml, where cancelling mid-upload would corrupt the remote state).
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint JS/JSX and CSS
    runs-on: ubuntu-latest
    # Same escape hatch as deploy.yml. GitHub natively suppresses a run only
    # for the exact string
    # `[skip ci]` (and `[ci skip]`, `[no ci]`, `[skip actions]`, `[actions skip]`)
    # — that list cannot be extended. The other spellings below are honoured here
    # instead: the run still appears in the Actions tab, but every job is skipped
    # in ~1s and no minutes are billed. String comparisons in GitHub expressions
    # are case-insensitive, so `WIP:` and `[SKIP-CI]` match too.
    if: >-
      github.event_name != 'push' ||
      (
        !startsWith(github.event.head_commit.message, 'wip') &&
        !contains(github.event.head_commit.message, '[skip ci]') &&
        !contains(github.event.head_commit.message, '[skip-ci]') &&
        !contains(github.event.head_commit.message, '[skip_ci]')
      )
    timeout-minutes: 15
    steps:
      # Actions are pinned to a commit SHA: a tag can be moved to point at
      # different code, a SHA cannot. The comment is the version it resolves to.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile --prefer-offline

      - name: Run lint (ESLint + stylelint)
        run: yarn lint

  internal-links:
    name: Internal links on new/changed articles
    runs-on: ubuntu-latest
    # Same escape hatch as deploy.yml. GitHub natively suppresses a run only
    # for the exact string
    # `[skip ci]` (and `[ci skip]`, `[no ci]`, `[skip actions]`, `[actions skip]`)
    # — that list cannot be extended. The other spellings below are honoured here
    # instead: the run still appears in the Actions tab, but every job is skipped
    # in ~1s and no minutes are billed. String comparisons in GitHub expressions
    # are case-insensitive, so `WIP:` and `[SKIP-CI]` match too.
    if: >-
      github.event_name != 'push' ||
      (
        !startsWith(github.event.head_commit.message, 'wip') &&
        !contains(github.event.head_commit.message, '[skip ci]') &&
        !contains(github.event.head_commit.message, '[skip-ci]') &&
        !contains(github.event.head_commit.message, '[skip_ci]')
      )
    timeout-minutes: 10
    # Informational on purpose: a missing cross-link is a writing remark, not a
    # reason to turn the whole run red. Findings show up as annotations.
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the diff needs the history, not just the tip commit
          # Only commit metadata and file *names* are needed below, never the
          # content of a historical version, so the blobs can be left on the
          # server instead of downloading a 280 MiB pack.
          filter: blob:none

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # The script has no dependency, so no `yarn install` here.
      - name: Check articles added or modified in this push/PR
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi

          # A brand new branch reports an all-zero "before" commit.
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$base" 2>/dev/null; then
            base="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"
          fi

          articles="$(git diff --name-only --diff-filter=ACM "$base" HEAD -- 'blog/**/index.md' 'blog/**/index.mdx' '.unpublished/**/index.md' '.unpublished/**/index.mdx')"

          if [ -z "$articles" ]; then
            echo "No article added or modified."
            exit 0
          fi

          status=0

          for article in $articles; do
            echo "::group::$article"

            if ! node scripts/internal-link-opportunities.mjs --post "$article"; then
              status=1
              echo "::warning file=$article::This article links to no other article. Next step: run 'yarn links:check $article' locally to see candidate targets, then add 2-4 links inline where the topic is named in the prose (or run the /links Claude Code command on this path)."
            fi

            echo "::endgroup::"
          done

          exit $status
