name: Node upgrade check

# Manual only. Answers one question before deploy.yml's `node-version` is bumped:
# does a full production build actually succeed on the newer Node? Running it
# here rather than locally matters — the failures worth catching are in native
# dependencies (sharp/libvips behind plugin-ideal-image, the swc and lightningcss
# binaries behind `future.faster`), and those depend on the exact platform, which
# only the real runner reproduces.
#
# Nothing is deployed and nothing is written back to the repository.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: node-upgrade-check
  cancel-in-progress: true

jobs:
  build:
    name: Build on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # One version failing must not hide the result of the others.
      fail-fast: false
      matrix:
        # 24 is what deploy.yml uses, kept as the control: if it fails too, the
        # problem is the build itself, not the version being evaluated. Add the
        # candidate version to this list before touching deploy.yml.
        node: [22, 24]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile --prefer-offline

      - name: Build website
        run: yarn build

      - name: Report
        if: always()
        run: |
          set -euo pipefail

          if [ -s build/index.html ]; then
            echo "| Node ${{ matrix.node }} | ✅ build OK | $(du -sh build | cut -f1) | $(find build -type f | wc -l) files |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| Node ${{ matrix.node }} | ❌ build failed | - | - |" >> "$GITHUB_STEP_SUMMARY"
          fi
