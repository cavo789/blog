name: Latest blog post workflow
on:
  schedule: # Run workflow automatically (in a cron)
    - cron: "0 12 * * 1" # Runs every Monday at 12:00 UTC
  workflow_dispatch: # This will allow to run the workflow manually too

permissions:
  contents: write # To write the generated contents to the readme

concurrency:
  group: blog-post-readme
  cancel-in-progress: true

jobs:
  update-readme-with-blog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Both actions are pinned to a commit SHA rather than a tag. That matters
      # most in this workflow: it is the only one holding `contents: write`, so
      # whoever controls the code behind these references can commit to the
      # repository. A tag can be repointed at new code at any time; a SHA cannot.
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Fetch and Update README
        # v1 is an annotated tag; this is the commit it dereferences to.
        uses: gautamkrishnar/blog-post-workflow@f177491c77670f150ab4e9b9890254d8eba4164b # v1
        with:
          feed_list: "https://www.avonture.be/blog/rss.xml"
          max_post_count: 10
          comment_tag_name: "BLOG-POST-LIST"
          date_format: "yyyy-mm-dd"
          template: "<tr><td>$title</td><td>$url</td></tr>"
          commit_message: "feat: Update README with latest blog posts"
