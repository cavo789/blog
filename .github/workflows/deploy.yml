name: Deploy blog on avonture.be

on:
  push:
    branches:
      - main
    # None of these paths can change the built site, and a deploy costs a full
    # build plus an rsync round-trip. Verified before listing .unpublished/:
    # no draft slug from that folder appears anywhere under build/.
    # Note: a push is skipped only when *every* changed file matches, so a
    # commit touching both a draft and a real post still deploys.
    paths-ignore:
      - ".claude/**"
      - ".config/**"
      - ".devcontainer/**"
      - ".scripts/**"
      - ".todos/**"
      - ".tools/**"
      - ".unpublished/**"
      - ".vscode/**"
      - "*.md"
      - "LICENSE"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List what rsync would transfer, without writing anything on the server"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

# This workflow only reads the repository; nothing is ever pushed back to it.
permissions:
  contents: read

# One deploy at a time: two overlapping rsync runs would be writing into the
# same remote tree. Queue instead of cancelling — a run killed mid-transfer
# leaves the site with a half-updated set of files.
concurrency:
  group: deploy-avonture
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy blog on avonture.be
    runs-on: ubuntu-latest
    # The build is ~1 min and rsync is seconds; 20 min is generous headroom
    # without letting a hung transfer burn hours of runner time.
    timeout-minutes: 20
    # Escape hatch. GitHub natively suppresses a run only for the exact string
    # `[skip ci]` (and `[ci skip]`, `[no ci]`, `[skip actions]`, `[actions skip]`)
    # — that list cannot be extended. The other spellings below are honoured here
    # instead: the run still appears in the Actions tab, but every job is skipped
    # in ~1s and no minutes are billed. String comparisons in GitHub expressions
    # are case-insensitive, so `WIP:` and `[SKIP-CI]` match too.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        !startsWith(github.event.head_commit.message, 'wip') &&
        !contains(github.event.head_commit.message, '[skip ci]') &&
        !contains(github.event.head_commit.message, '[skip-ci]') &&
        !contains(github.event.head_commit.message, '[skip_ci]')
      )
    steps:
      # Third-party and first-party actions alike are pinned to a commit SHA:
      # a tag can be moved to point at different code, a SHA cannot. The
      # trailing comment is the human-readable version each SHA resolves to.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full git history is required so the blog plugin's showLastUpdateTime /
          # showLastUpdateAuthor can read each post's real last-commit date/author
          # instead of the single shallow-clone commit.
          fetch-depth: 0
          # ...but only the history is needed, not every past version of every
          # file. This repo's pack is 280 MiB, mostly old article images still
          # living in history. A blobless partial clone fetches all commits and
          # trees while skipping file contents, except those needed to materialize
          # the current checkout. Safe here because nothing in this workflow reads
          # historical file *content* (that would trigger a slow on-demand fetch)
          # — showLastUpdateTime only needs commit metadata.
          filter: blob:none

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          # Caches the yarn download cache (~/.cache/yarn), keyed on yarn.lock.
          # Deliberately the only cache in this workflow: node_modules is 2.6 GB
          # here (including a ~1 GB webpack cache under node_modules/.cache) while
          # a cold build is 59 s against 23 s warm. Archiving and restoring an
          # entry that size to save ~35 s is a net loss, and it would evict
          # everything else from the 10 GB per-repository cache budget.
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile --prefer-offline

      - name: Build website
        run: yarn build

      # A broken sitemap or feed is worse than a late deploy, and far more
      # annoying to undo once 3000 files have landed on the server.
      - name: Sanity-check the build
        run: |
          set -euo pipefail

          for file in build/index.html build/sitemap.xml build/blog/rss.xml; do
            if [ ! -s "$file" ]; then
              echo "::error::$file is missing or empty — refusing to deploy"
              exit 1
            fi
          done

          if command -v xmllint >/dev/null 2>&1; then
            xmllint --noout build/sitemap.xml build/blog/rss.xml
          else
            python3 -c 'import sys, xml.dom.minidom; [xml.dom.minidom.parse(p) for p in sys.argv[1:]]' \
              build/sitemap.xml build/blog/rss.xml
          fi

      # Shows up on the run's summary page. The size and file count are the
      # numbers to watch: a sudden jump means the build stopped being
      # reproducible again and rsync is about to re-upload the whole site.
      - name: Build report
        run: |
          set -euo pipefail

          {
            echo "### Build"
            echo
            echo "| Metric | Value |"
            echo "| --- | --- |"
            echo "| Total size | $(du -sh build | cut -f1) |"
            echo "| Files | $(find build -type f | wc -l) |"
            echo "| HTML pages | $(find build -name '*.html' | wc -l) |"
            echo "| Sitemap URLs | $(grep -c '<loc>' build/sitemap.xml) |"
          } >> "$GITHUB_STEP_SUMMARY"

      # No third-party action for the transfer: rsync over SSH is a one-liner,
      # and it keeps the private key from passing through code we don't control.
      - name: Deploy to avonture.be over SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          REMOTE_PATH: ${{ secrets.REMOTE_PATH }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          set -euo pipefail

          install -m 700 -d ~/.ssh
          # printf, not echo: the key is multi-line and must keep its final newline.
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # The server's host key is pinned, not learned at run time. Running
          # `ssh-keyscan` here would have meant trusting whatever answered on the
          # spot — fine against a passive observer, useless against anyone able to
          # intercept that first connection. The expected key lives in a secret
          # instead, so a substituted server fails the connection rather than
          # silently receiving the whole site.
          #
          # To (re)generate it, take the entry you already trust from your own
          # machine — `ssh-keygen -F '[host]:port' | grep -v '^#'` — and store the
          # output as the SSH_KNOWN_HOSTS secret. It changes only if the host
          # rebuilds its SSH identity, which is exactly when you want to be told.
          if [ -z "${SSH_KNOWN_HOSTS:-}" ]; then
            echo "::error::The SSH_KNOWN_HOSTS secret is empty. Generate it with: ssh-keygen -F '[<host>]:<port>' | grep -v '^#'"
            exit 1
          fi

          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          # --checksum is the flag that makes this cheap. rsync's default compares
          # size plus modification time, and Docusaurus rewrites every file on every
          # build, so all 3000 mtimes always look new. Comparing content hashes
          # instead means only genuinely changed files cross the wire — roughly
          # 1.8 MB out of 166 MB now that the build is reproducible.
          #
          # No --delete: the remote web root holds files that do not come from this
          # build, and losing them is a worse outcome than leaving orphans behind.
          # The cost is that nothing is ever removed server-side — old hashed chunks
          # pile up, and the page of a deleted or re-drafted article stays online
          # until someone deletes it by hand. Auditing that is a manual step:
          # `rsync -rn --delete … | grep '^deleting'` lists the candidates without
          # touching anything.
          #
          # --chmod normalizes modes server-side, so the runner's umask cannot end
          # up publishing group- or world-writable files.
          #
          # admin-data/ is excluded: drafts.json lists every draft and unlisted
          # post. The build still writes it locally, where /admin can use it.
          rsync_args=(
            --recursive
            --links
            --times
            --compress
            --checksum
            --human-readable
            --stats
            --chmod=D755,F644
            -e "ssh -i $HOME/.ssh/deploy_key -p $SSH_PORT -o StrictHostKeyChecking=yes"
          )

          if [ "${DRY_RUN:-false}" = "true" ]; then
            echo "::notice::Dry run — nothing will be written on the server."
            rsync_args+=(--dry-run --itemize-changes)
          fi

          remote="$SSH_USER@$SSH_HOST:$REMOTE_PATH"

          # The transfer runs in three passes so that --delete can be used where it
          # is safe and nowhere else. Splitting it costs nothing: each file is still
          # checksummed exactly once.
          #
          # Pass 1 — the site, WITHOUT --delete. The remote web root also holds
          # things this build never produces: a PHP API with live reader data and
          # its .env, and .well-known/ (the ACME challenge folder for SSL renewal
          # and atproto-did, which backs the Bluesky domain handle). None of it can
          # be recovered from this repository, so nothing here deletes anything.
          # The trailing slash on build/ matters: it copies the *contents* of
          # build/ into REMOTE_PATH, rather than creating REMOTE_PATH/build/.
          # `set -o pipefail` above keeps rsync's exit code across the tee.
          #
          # admin-data/drafts.json is excluded outright: it lists every draft and
          # unlisted post. The build still writes it locally, where /admin uses it.
          rsync "${rsync_args[@]}" \
            --exclude "admin-data/***" \
            --exclude "/assets/***" \
            --exclude "/pagefind/***" \
            build/ "$remote/" | tee /tmp/rsync-site.log

          # Passes 2 and 3 — assets/ and pagefind/ are 100% generated output with
          # content-hashed filenames, so anything there that the build no longer
          # produces is dead weight by definition. Pagefind is the reason this
          # matters: it re-chunks its search index on every build, leaving ~59
          # orphan files behind each time. Restricting --delete to these two source
          # and destination paths bounds the blast radius by construction — it
          # cannot reach outside them even if this comment is wrong.
          for generated in assets pagefind; do
            rsync "${rsync_args[@]}" --delete \
              "build/$generated/" "$remote/$generated/" | tee "/tmp/rsync-$generated.log"
          done

          # Surface the numbers on the run summary rather than leaving them buried
          # in the step log. "Data" is the health check of the whole pipeline: if it
          # ever jumps back to tens of megabytes, the build has stopped being
          # reproducible and every page is being re-uploaded.
          stat_of() { grep -oP "(?<=^$2: ).*" "$1" | tail -1 || true; }

          {
            echo "### Transfer"
            echo
            echo "| Pass | Files | Data | Deleted |"
            echo "| --- | --- | --- | --- |"
            for pass in site assets pagefind; do
              log="/tmp/rsync-$pass.log"
              echo "| $pass | $(stat_of "$log" 'Number of regular files transferred') | $(stat_of "$log" 'Total transferred file size') | $(stat_of "$log" 'Number of deleted files') |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      # A deploy can report success while the live site is broken: a half-written
      # index.html, or a transfer that stopped partway through.
      - name: Smoke-test the live site
        if: github.event.inputs.dry_run != 'true'
        run: |
          set -euo pipefail

          for url in \
            "https://www.avonture.be/" \
            "https://www.avonture.be/sitemap.xml" \
            "https://www.avonture.be/blog/rss.xml"; do
            code="$(curl -sS -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 5 --max-time 30 "$url")"
            echo "$code  $url"
            if [ "$code" != "200" ]; then
              echo "::error::$url answered HTTP $code after the deploy"
              exit 1
            fi
          done
