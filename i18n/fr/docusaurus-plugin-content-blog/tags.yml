# French version of blog/tags.yml.
# `permalink` is copied verbatim on purpose: translating it would break the resolution of
# the `tags: [docker]` values in every article's front matter.
# Labels: only the generic ones change — a product name (Docker, PHP, WinSCP) is identical
# in both languages. Descriptions: all translated, they are prose shown on each tag page.
# See TODO 0119.
