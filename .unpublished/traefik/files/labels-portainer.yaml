# Added to the portainer service from the Portainer article's compose.yaml
# — the port mapping under `ports:` can stay or go; Traefik reaches the
# container directly over the proxy network either way.

  portainer:
    # ... image, container_name, volumes unchanged ...
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.http.routers.portainer.rule=Host(`portainer.home.arpa`)
      - traefik.http.routers.portainer.entrypoints=websecure
      - traefik.http.routers.portainer.tls=true
      - traefik.http.services.portainer.loadbalancer.server.port=9443
      - traefik.http.services.portainer.loadbalancer.server.scheme=https
      # Portainer's own cert is self-signed — tell Traefik not to validate it
      - traefik.http.services.portainer.loadbalancer.serverstransport=portainer-insecure@docker
      - traefik.http.serverstransports.portainer-insecure.insecureskipverify=true

networks:
  proxy:
    external: true
