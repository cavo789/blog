; Xdebug 3.x — step debugging only, kept off in production images by simply
; not installing this file there.
xdebug.mode = debug,develop
xdebug.start_with_request = yes
xdebug.client_host = host.docker.internal
xdebug.client_port = 9003
xdebug.discover_client_host = false

; Uncomment while diagnosing a connection that never reaches VSCode:
; xdebug.log = /tmp/xdebug.log
; xdebug.log_level = 7
