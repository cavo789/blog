services:
  web:
    image: nginx:1.25
    ports:
      - "8080:80"
    environment:
      APP_ENV: production
      LOG_LEVEL: info
    volumes:
      - ./html:/usr/share/nginx/html:ro
    depends_on:
      - db

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: myapp
      POSTGRES_PASSWORD: s3cr3t
      POSTGRES_DB: myapp_db
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
